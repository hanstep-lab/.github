name: Refactor
description: 리팩터링
title: "[refactor] "
body:
  - type: input
    id: refs
    attributes:
      label: 관련 API·화면
      placeholder: "예: FIN-05"
  - type: textarea
    id: background
    attributes:
      label: 바꾸려는 이유
      description: 지금 구조의 문제점
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: "예: 기존 API 응답 동일, 테스트 통과"
  - type: input
    id: due
    attributes:
      label: 마감일
      placeholder: "예: 2026-11-05"
  - type: textarea
    id: notes
    attributes:
      label: 참고 자료
