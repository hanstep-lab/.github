name: Feature
description: 기능 개발
title: "[feat] "
body:
  - type: input
    id: refs
    attributes:
      label: 관련 API·화면
      description: 노션 API ID나 피그마 화면 ID
      placeholder: "예: AUTH-01, ON-001"
  - type: textarea
    id: background
    attributes:
      label: 배경·목적
      description: 왜 이 작업이 필요한지
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 끝인지
      placeholder: "예: Swagger에서 200 응답 확인, 피그마와 화면 일치"
  - type: input
    id: due
    attributes:
      label: 마감일
      placeholder: "예: 2026-11-05"
  - type: textarea
    id: notes
    attributes:
      label: 참고 자료
      description: 노션, 피그마, 관련 이슈·PR 링크
